    ⛔ AND THE LAYERS HERE WERE REPOINTED, which is worth saying because the record does not have a
    field for it (fg: a change record cannot say its answer was superseded). This was closed against
    a `<file>#<KEY>` pointer at the application's own env file — resolveTheme,
    mock-theme-undeclared, "Prefer the pointer to the name". 0086 removed every one of them, because
    the pointer put one customer's variable name into this model. The request still stands and is
    still satisfied: ProductOS remembers the theme in the corpus, per project, chosen with
    `v2 style --wear`. `said:` is untouched — his words do not move when our answer does — and the
    layers name what satisfies it now, because a record pointing at symbols nobody can find is a
    record that has silently stopped being checkable.
