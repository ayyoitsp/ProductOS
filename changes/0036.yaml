  derive: FORBIDDEN_TO_AUTHORS
  generate: presetBlock
  surface: SHIMS
  instruct: productos:preset
  pin: every author writes, none may settle
waived:
  check: |-
    The check layer is `src/v2/check.ts`, which reports what is wrong in somebody's CORPUS. This
    concept adds nothing a corpus can be wrong about — an author is a role in the framework, and
    whether a corpus was written by one is already recorded where it matters: every act carries
    `via`, and `via: agent` never counts as agreement. What can go wrong here is structural — a
    preset naming a role that does not exist, an author declaring a question tool, a skill whose
    preset has drifted from the registry — and all three are detected by `danglingSteps` and the
    registry tests rather than by a corpus check. Arguable: if presets ever become per-project
    configuration rather than framework data, a project could hold an invalid one and this would
    need a real check.
