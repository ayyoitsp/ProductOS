    Nothing new generates, and the one thing that moved was a ROUTE — which is data in
    `src/core/jobs.ts`, walked by `agents-doc.ts` to produce the skill and the agent tree. Both
    regenerated with the generators untouched, and the two drift tests went green on the
    regenerated files, so this is demonstrated rather than argued. ⛔ Arguable the day the
    decomposer or the demonstrator is run BY a generator instead of spawned as a role — which is
