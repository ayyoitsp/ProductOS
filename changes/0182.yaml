id: "0182"
said: nothing detects that collision - worth a check, not a model change
at: 2026-10-17
kind: derivation
reaches:
  check: one-name-two-things
  pin: a view and an exchange sharing a name is refused
waived:
  derive: >-
    Nothing is computed differently. The author who found this said it in their own words - "worth
    a check, not a model change" - and they were right: views and exchanges are different things
    and each may be named freely. What was missing was anybody NOTICING the two namespaces meeting
    inside one scope, which is the only place <scope>#<name> becomes ambiguous. A derivation change
    here would mean deciding which of the two a colliding ref resolves to, and that is the bug.
  surface: >-
    The finding reaches a reader through the same two surfaces every refusal does - the check's
    output and the page's refusal list - with no new rendering. A surface change would be a second
    home for a message that already has one.
