# ⛔ APPENDED AFTER `change close`, which drops comments. See 0141 / 0144-0167.
#
# Peter: *"uhm. this feature seems largely broken. let me re-prhase. get rid of the fucking anchors.
# URLs should follow the menu structure."* — then, asked for the shape: *"v2/overview,
# v2/product/{feature}/{subfeature}, etc"*.
#
# ⛔ 0167 ANSWERED A SMALLER QUESTION THAN HE ASKED, AND ITS PIN LET IT. It gave each scope a flat
# `/v2/<scope>` and still hung `#at-<scope>` off the end — so the address bar read
# `/v2/part-0#at-part-0`: an address and an anchor saying the same thing twice, in a shape that
# tells a reader nothing about where they are. The pin asked whether every link RESOLVED, and that
# shape resolves perfectly. A link can answer 200 and be the wrong URL.
#
# ⛔ SO THIS PIN ASSERTS THE SHAPE. `every link is a menu path, and not one of them is an anchor`:
# zero `#` in any href, and `thing-0` addressed as `/v2/part-0/thing-0` rather than `/v2/thing-0` —
# a flat address resolves and is the thing he called broken. Both verified red against 0167's build.
#
# ⛔ AND THE MENU PATH IS NOT A NEW DERIVATION. `trails` already held exactly this chain, because it
# is what the breadcrumbs are drawn from. It lived inside `renderNav`, which was right while it only
# drew crumbs and wrong the moment the URL became the path — so it is lifted to `trailsOf(corpus)`
# and both the addresses and the crumbs read it. The URL and the breadcrumb above it cannot disagree
# about where something sits, because there is one chain.
#
# ⛔ A REF BELOW A SCOPE CONTINUES THE PATH rather than becoming a fragment: `money#balance#may` is
# `…/money/balance/may`. The `#` separators of a ref ARE the nesting the menu shows. The browser
# finds the element by `[data-ref]` and scrolls to it — by what the thing IS, not by an anchor.
#
# ⛔ THREE THINGS HAD TO CHANGE TOGETHER or the address is decoration:
#   · the renderer writes the path
#   · the ROUTE resolves every segment of it — it read exactly one, so `/v2/part-0/thing-0` would
#     have 404ed on an address the page itself had just written
#   · ARRIVAL reads the path. It read `location.hash`, so every address that named something landed
#     the reader on Overview — which is most of what "largely broken" was
#
# Driven, `scripts/probe-durable.mjs`:
#
#     the nav addresses "thing-0" as   /p/prj-probe/v2/part-0/thing-0
#     after pressing it
#       address   /p/prj-probe/v2/part-0/thing-0
#       showing   ["thing-0"]
#       reloaded  no
#     opening it cold, in a new page
#       title     Thing 0        showing ["thing-0"]
#
# ⛔ A FILE KEEPS ITS FRAGMENT, and removing that was a real regression I shipped for ten minutes.
# `v2 page --out` and a published artifact have no address, so pushing nothing left a saved page
# unable to say where it was and broke its back button. Caught by
# `v2-a-container-in-the-menu-collapses`, which drives a FILE render. Getting rid of anchors means
# getting rid of them where there is an alternative.
#
# ⛔ AND A PROXY OF MINE MEASURED THE OPPOSITE OF WHAT I MEANT. The first version of the resolution
# pin asserted the scoped page is SMALLER than the root. It is larger — 380,398 against 327,853 —
# because the root defers every section but one while a scoped page renders its feature whole. It
# asserts the title and the subtree now, which is the thing "scoped" actually means.
#
# 1097/1097.
