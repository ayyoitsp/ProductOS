  generate: nothing generates a charter — these are the sentences a person writes about their own product, and a generator proposing goals would be software authoring the thing every feature is judged against.
  check: no new refusal. What was missing was the ABILITY to agree, not a rule about having agreed — and a check demanding every goal be signed off would refuse a corpus on its first day. The queue surfaces them; whether a product-wide document must be fully agreed before its features are is a real question and it is PT-0002's, not this change's.
