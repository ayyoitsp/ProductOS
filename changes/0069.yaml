waived:
  derive: nothing is derived. The whole point is that these two documents are misfiled BY CONSTRUCTION, so the finding keys on the document id rather than inferring anything from the prose. ⛔ The first version did infer — a regex for exclusions and dated choices — and found 8 of the 13 on the real corpus, missing the ones whose negation was not at the front. A derivation here was the bug.
  surface: no new surface. These sections already render, and since top-level consent landed they already carry the act and the badge. What was missing was anybody saying they are in the wrong place, which is a finding.
  instruct: the homes are already in the scoper's instructions — out_of_scope with a reason, a named refuses outcome, happy_path.not — and the finding names them at the point somebody reads it. ⛔ Adding a paragraph telling authors not to create a document the tool no longer creates would be instructing against a mistake nothing invites any more.
