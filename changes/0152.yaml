# ⛔ APPENDED AFTER `change close`, which drops comments. See 0141 / 0144-0151.
#
# Peter: *"uh, you mean move it to a blob? or why can't we just not re-read the images?"*, then
# *"let's do both - ne wrow for images, and don't re-read images"*. 0151 did the row; this is the
# half it closed by naming as still owed.
#
# WHAT A REQUEST NOW PULLS, on a Bilrost-shaped corpus — `scripts/bench-split.mjs`:
#
#     cold read                  truth 2.71 MB   drawings 14.82 MB
#     warm read                  truth 0.00 MB   drawings  0.00 MB
#     a save, after an edit      truth 2.71 MB   drawings  0.00 MB   <- the point
#     the page after the save    truth 2.71 MB   drawings  0.00 MB
#     the page after a redraw    truth 0.00 MB   drawings 14.82 MB   <- the other direction
#
# A one-line edit to a screen's words costs 2.71 MB instead of 17.53 MB.
#
# ⛔ TWO FINGERPRINTS, IN ONE ROUND TRIP. `fingerprint()` returns `{truth, drawings}` from two
# filtered aggregates in a single statement — `count(*) filter (where path not like 'drawings/%')`
# and its complement. Writing it as two sequential awaits is the mistake the comment four lines
# above `materializeProject` already warns about, and I made it once today before reading that.
#
# ⛔ SPLIT BY WHERE THE DOCUMENT LIVES, NOT BY WHAT IT LOOKS LIKE. `drawings/` is the one prefix
# the generator owns; everything else is somebody's words. A fact about the corpus layout cannot be
# wrong about a document nobody anticipated, which a content heuristic would be.
#
# ⛔ THE LOG BELONGS TO `truth`. An appended event changes what a reader of the log sees and cannot
# change a drawing, so `max(seq)` is in the truth half — and `since(0, …)` is skipped on exactly
# the requests that skip the sentences.
#
# ⛔ THE NEW FACT IS THE DRAWINGS ASSERTION, AND IT IS THE ONLY ONE THAT COULD NOT PASS BY ACCIDENT.
# "The truth was re-read" is what the whole-corpus cache already did. Verified by pointing both
# halves at the same fingerprint in `dist/` and watching the pin go red with the right message —
# `the drawings were read 2 times — a sentence edit re-read the pictures`.
#
# ⛔ AND THE OTHER DIRECTION IS PINNED IN THE SAME TEST, because a cache that keeps a stale picture
# is strictly worse than the cost it removed: a redraw must still invalidate the drawings half, and
# must not drag the sentences back with it. Both asserted, both non-zero.
#
# ⛔ `calls.documents` IS STILL COUNTED, AND ASSERTED TO BE ZERO ON A REQUEST. `documents()` reads
# the whole corpus in one go — that is the 19 MB this file exists to have removed — so the pin says
# nothing on a request path may call it any more, rather than leaving that to be noticed later.
#
# WHAT IS NOT DONE: a save still LAYS OUT its own directory, which writes all 17.5 MB to local
# disk. That is unchanged by this and was never the network cost; a mutating request cannot share
# a directory, because `writeBack` diffs the files on it.
#
# 1008/1008.
#
# ⛔ APPENDED AGAIN, AND IT IS THE IMPORTANT PART. SPLITTING THE ROW BROKE THE WRITE PATH, AND
# NOTHING IN 1008 TESTS SAID SO.
#
# `writeBack` computes `removed = keys(before).filter(k => !(k in after))`, where `before` is what
# the store holds and `after` is `corpusFiles(dir)`. And `corpusFiles` read ONE level deep, matching
# only `.md|.ya?ml` — so `drawings/<scope>/<view>.html` was invisible to it. Two consequences:
#
#   · EVERY SAVE WOULD HAVE DEPRECATED EVERY DRAWING IN THE PROJECT. All 83 of Bilrost's, on the
#     next placement save, leaving every screen in the product blank.
#   · A DRAWING DRAWN ON THE INSTANCE NEVER REACHED THE STORE. It existed for one request and went
#     out with the temp directory.
#
# ⛔ FOUND BY A NUMBER THAT WAS IMPOSSIBLE, NOT BY A TEST. `scripts/bench-layout.mjs` reported 15 MB
# read back off local disk in 1ms. 15 GB/s is not a fast read; it is a read that did not happen.
# This is the rule at the top of CLAUDE.md working as intended, one more time: the aggregate agreed
# with what I wanted, and the only thing that caught it was the aggregate being absurd.
#
# ⛔ AND THE SEAM TEST WRITTEN IN THE SAME HOUR TO CATCH EXACTLY THIS DID NOT. "A held write records
# exactly what moved" exercises `memoryStore`; this path goes through a directory. 0151 names the
# risk as "a drawing landing where no reader looks", and it had landed precisely there — one layer
# over from where I was looking for it.
#
# FIXED: `corpusFiles` walks each corpus directory to whatever depth it has, and `CORPUS_EXT`
# includes `.html`. Pinned by two tests in `v2-a-write-asks-for-what-it-changed`, both verified red
# on the previous build. The benchmark now prints the bytes beside the timing, so a read with
# nothing behind it is visible rather than flattering.
#
# AND THE "NOT DONE" ABOVE IS SMALLER THAN IT SOUNDED. Laying a 15 MB corpus out and parsing it is
# ~44ms and ~19ms locally — a floor a save pays, not the seconds Peter was waiting on.
#
# 1010/1010.
