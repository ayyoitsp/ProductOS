  check: No corpus becomes wrong by this, and that is the test for whether a check belongs. What a request pulls out of the store is invisible in the product truth it produces — the same corpus comes out either way, which is the thing the pin asserts. A check that fired on this would be reporting a performance property to an author who cannot act on it, and `src/v2/check.ts` is for findings an author fixes. The risk the split carries is the opposite direction — a kept drawing that is stale — and that is a pin, because it is a fact about the code rather than about anybody's corpus.
