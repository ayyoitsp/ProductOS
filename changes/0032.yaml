id: "0032"
said: migrate --force deletes the whole truth, rules and charter trees and regenerates from v1, so any scope authored directly in v2 is destroyed without being named. Two scopes written yesterday — master-worksheet and price-a-deal, with the pull behaviour drawn from the add-in code — were gone this morning, and nothing anywhere recorded that they had been removed or that authoring into v2 was unsafe.
at: 2026-09-29
kind: derivation
reaches:
  surface: setAside
  pin: set the trees aside
waived:
  derive: nothing is derived differently — the fix is that a regeneration stops deleting what it cannot rebuild, and that lives in the command
  check: "there is nothing left for a check to catch: the file is restored before anything could observe it missing"
closed: 2026-09-29
