  pin: the subsystems render as a nested tree a person can read
waived:
  generate: |
    Nothing new generates, and this is the same mechanism `0090` waived it on — demonstrated rather than argued. AGENTS.md, the skill's routes and the installed agent files are all produced by walking the registries, so the role appeared in all three the moment it was declared and no generator changed a line: regenerating both documents produced the new role and the new route with `agents-doc.ts` untouched, and the two drift tests then went green on the regenerated files. ⛔ Arguable the day a capability has to be DRAWN — a subsystem diagram derived from `serves` and `uses` would be a real generator, and this waiver is the record of what that would add.
