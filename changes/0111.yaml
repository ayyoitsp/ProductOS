id: "0111"
said: uh, who deleted the capability tree? those should flow from the product design. engineers should more or less handle the capabilities. capabilities are something engineers can/should agree on in the future.. yes, capabilities need to come back. same nested structure as product. these are general subsystems. we have an engineering role that shoudl be mapping product feature into subsystems and figure out where they belong. capabilities are like object oriented design. just designing the subsystems, roughly what they do. that's it. they shoudl be logically grouped into areas. they obviously nest, or cross reference other areas.
at: 2026-10-07
