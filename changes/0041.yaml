waived:
  generate: |-
    Nothing is generated differently by this change. It is a reading — of which exchange a control
    performs, and of whether a sentence says somebody is taken somewhere — plus a reviewer, a check
    and a surface that stamps what the reading produced. `draw` produces the same bytes before and
    after. Arguable: `withGoes` writes a derived destination INTO the drawing, which is generation
    in the loose sense — but it happens at page render, from the corpus, and the generate area owns
    what turns a source into stored output. Filing it here would make "generate" mean any string
    substitution anywhere.
