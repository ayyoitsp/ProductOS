id: "0043"
said: |-
  oh i see the confusion - we are going straight to the deals list on completion.  but we should be
  showing a completion screen here.. or maybe we should have a placeholder indicating that the flow
  is complete? awkwards to go back to the deals list feature from here
at: 2026-09-30
kind: concept
reaches:
  derive: finishesFor
  surface: data-finishes
  check: nothing-finishes-this-feature
  instruct: "`ends_with` is what a reviewer reads when the walk finishes"
  pin: the control that ends the happy path is the one that finishes the feature
waived:
  model: |-
    No new field, deliberately. `happy_path.ends_with` already says what finishing means and the
    schema has required it since it was written — all twenty scopes with a happy path carry one.
    What was missing was not a way to SAY a feature completes; it was anything rendering the
    sentence at the moment somebody completes it. Adding a "completion screen" concept would have
    put a second, emptier record beside a required field. Arguable: if a feature ever needs a
    completion state a person can look at rather than a sentence they are told, that is a real
    concept and this waiver stops holding.
  generate: |-
    `draw` produces the same bytes before and after. The finish is stamped onto the drawing at page
    render from the corpus, the same way a derived destination is — see the note on change 0041 for
    why that is surface rather than generate.
