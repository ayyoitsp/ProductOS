waived:
  model: "the model needed nothing, and that is the finding rather than an omission. `exists` already lives on an exchange, a view and a scope; `Statement` is strict with two fields and `SlotFill` has none. ⛔ So rather than adding `exists` to two more objects — which would make every surface handle withdrawn at two new grains — the act REFUSES the grain the model cannot express and offers the two that work: reword it, or take out the whole behaviour. Agreed truth is not deleted, it is reworded, and the model already said so."
  generate: nothing is generated by this. The row is a rendering of truth that already exists, and the act writes into the file the author owns.
  check: "no new refusal. Taking a behaviour out is an act with its own refusals — a reason owed where somebody agreed, and the grain the model cannot mark — and those are enforced in the act rather than reported afterwards. ⛔ A check would be the wrong layer: it fires after the corpus is written, and the whole point here is that the act refuses before anything is lost."
  instruct: no author writes any of this. An author writes truth; the row, the icons and the act are how a PERSON reviews it, and the only instruction that could exist — how to press a button — is the thing the surface is for.
closed: 2026-10-02
