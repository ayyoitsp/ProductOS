said: 'I sent no `via`; the door recorded `via: "page"`, which `isHuman` counts as a person. Harmless here (no `disputes`, and `by: productos-interviewer`), but it means an agent filing `disputes: true` through this HTTP door would withdraw a question from the worklist as though a person had rejected it — `questionsFor` gates that on `isHuman(n.via)`, not on `by`. Worth a look at `watchedAPerson` for a token coming in over `/api/v2/in`.'
