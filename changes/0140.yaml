# And `gapsWhoseFieldShipped`, which exists because an architect counted five of fifteen open gaps
# naming already-shipped fields, was finding 37 of the 146 fields in v2/schema.ts: it required
# exactly two spaces of indent, required `z.` on the same line (so `rests_on: z` + newline was
# invisible), and was handed core/product.ts — the v1 schema, where no v2 field can appear. Two of
# those three are FORMATTING. Now 166 fields.
#
# Its answer against the real backlog is still zero, so the number proves nothing alone:
#
#     a gap naming a field that HAS shipped        1 flagged
#     a gap naming a field that has NOT shipped    0 flagged
#     the five real open gaps                      0 flagged   ← a TRUE zero
#     a closed gap naming a shipped field          0 flagged
#
# The real gaps name no shipped field because A GAP DESCRIBES WHAT IS MISSING — fg-0013 said "a slot
