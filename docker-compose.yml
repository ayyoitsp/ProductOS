# ProductOS, standing up on its own.
#
# ⛔ THIS FILE USED TO BE FAMILY WALLET'S. The demo consumer app's API and database sat at the repo
# root reading as this project's infrastructure, which is exactly the kind of thing somebody deploys
# by accident. It moved to `backend/docker-compose.yml`, next to the app it belongs to.
#
#   docker compose up --build
#   curl localhost:4100/health
#
# Single-account mode is on here, because a compose file is somebody's machine. ⛔ Remove
# PRODUCTOS_SINGLE_ACCOUNT for a hosted deployment, where signing in or holding a token is the only
# way in.

# ⛔ NAMED, NOT DERIVED FROM THE FOLDER — AND NOW NAMED DELIBERATELY PER STACK.
#
# Compose derives the project name from the containing folder, and the volume is
# named `<project>_productos_data`. So the same stack run from a worktree
# (`productos-2`) and from the main checkout used two DIFFERENT volumes, and the
# second came up empty — which reads exactly like the data is gone. Pinning it
# fixed that, and left every checkout sharing one database and one port.
#
# ⛔ `productos` IS DEV, AND DEV SERVES WHAT IS MERGED. Peter: *"i'd like 'dev' to be
# up to date, and we already redeploy 4100 with what's merged. individual trees can
# maintain their own docker instance/own port, but 4100 should be kept clean"*. So a
# worktree gets its own project, its own volume and its own ports — set by
# `scripts/stack.sh`, which refuses to hand a worktree this name or this port.
# Unset is the main checkout, which is the old behaviour exactly.
# ⛔ REQUIRED, NOT DEFAULTED — BECAUSE THE DEFAULT WAS STAGING.
#
# This read `${PRODUCTOS_STACK:-productos}`, and `productos` on 4100 is now staging. So a bare
# `docker compose up` in this checkout — with none of the Makefile's exports in the environment —
# silently claimed staging's project name and staging's port. It happened twice while building
# this: once from a worktree whose branch lacked `scripts/stack.sh`, and once from a plain shell,
# where it got as far as `Bind for 0.0.0.0:4100 failed: port is already allocated`. A clash is the
# cheap version; the expensive one is a dev container answering on the URL a corpus is reviewed on.
#
# A guard that enumerates the ways round a bad default is strictly worse than not having one. So
# compose refuses, and names the command that sets it.
name: ${PRODUCTOS_STACK:?set by make — use `make up`, not a bare docker compose, so the stack and ports come from scripts/stack.sh}

services:
  postgres:
    # ⛔ THE SAME MAJOR AS THE MANAGED STORE, OR A STAGING DUMP CANNOT BE RESTORED HERE.
    #
    # This was pinned to 16 while `PG_CLIENT` — what `backup-remote` dumps with — was 18. So a dump
    # taken from staging (Neon, 18.6) emitted `SET transaction_timeout = 0`, which is a 17 addition,
    # and `make restore` died on `unrecognized configuration parameter` with `ON_ERROR_STOP`. That
    # makes "clone staging into your dev stack" impossible as shipped, which is the one thing a dev
    # stack is for.
    #
    # ⛔ ONE VARIABLE, BECAUSE TWO NUMBERS IN TWO FILES IS WHAT DRIFTED. The Makefile exports
    # `PG_IMAGE` and derives `PG_CLIENT` from the same default, so the server and the client that
    # dumps into it cannot disagree again.
    #
    # ⛔ AN EXISTING DEV VOLUME WILL NOT START UNDER A NEW MAJOR — Postgres refuses data files from
    # an older one, loudly. That is `make nuke` on your own stack, which costs a Docker volume and
    # nothing else; a dev stack holds no truth that is not a copy of something.
    image: ${PG_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_USER: productos
      POSTGRES_PASSWORD: productos
      POSTGRES_DB: productos
    # ⛔ ALSO A VARIABLE, OR THE SECOND STACK CANNOT START. Two projects each binding 5432 is not a
    #    shared database — it is the second `up` failing on "port is already allocated", which reads
    #    as Docker being broken rather than as two stacks wanting the same port.
    ports:
      - "${PG_PORT:?set by make — use `make up`}:5432"
    volumes:
      # ⛔ `/var/lib/postgresql`, NOT `…/data` — THE 18 IMAGES MOVED THE MOUNT POINT.
      #
      # From 18 the official images keep data in a major-version-specific subdirectory, so the
      # volume belongs one level up and Postgres puts `18/docker` inside it. Mounted at the old
      # path, 18 refuses to start and says it found "PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)" — which reads as a failed upgrade even on a volume created seconds
      # earlier, because what it is objecting to is the LAYOUT, not the contents.
      #
      # The payoff is the one the image documents: a single mount here is what makes
      # `pg_upgrade --link` possible later without fighting a mount boundary.
      - productos_data:/var/lib/postgresql
    # ⛔ The instance refuses to start without a reachable store, so waiting on this is not
    #    optional — without it the first boot is a crash loop that looks like a bug in ProductOS.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos -d productos"]
      interval: 2s
      timeout: 5s
      retries: 20

  productos:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ⛔ THE LOCAL STACK IS LOCAL. NO ENV OVERRIDE, AND THAT IS A CORRECTION.
      #
      # This was `${DATABASE_URL:-postgres://…@postgres:5432/productos}`, on the reasoning that an
      # external store should win if one is named. Compose reads `.env` automatically, and `.env`
      # here names Neon — so `make up` started a local Postgres that nothing used and pointed the
      # app at the SHARED store. From any worktree. `remote-guard` refuses `up-remote` from a
      # worktree because "the managed store is one shared database… There is no port that makes
      # that safe", and this was the same door standing open two files away.
      #
      # Found by printing what compose actually resolves, not by reading it: the dev stack's
      # DATABASE_URL came out as the Neon host.
      #
      # Peter, asked directly whether a dev stack may ever point at staging's store: never — own
      # Postgres always. So the decision now lives in the file rather than in a guard that has to
      # enumerate the ways round it. An external store is `docker-compose.remote.yml`'s whole job
      # and its only job.
      DATABASE_URL: postgres://productos:productos@postgres:5432/productos
      PORT: "4100"
      PRODUCTOS_SINGLE_ACCOUNT: ${PRODUCTOS_SINGLE_ACCOUNT:-me@localhost}
      PRODUCTOS_AUTH: ${PRODUCTOS_AUTH:-}
    ports:
      - "${PORT:?set by make — use `make up`}:4100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  productos_data:
