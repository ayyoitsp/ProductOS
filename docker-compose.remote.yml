# ProductOS against a store it does not own — Neon, Azure Database for PostgreSQL,
# RDS, Cloud SQL, or a Postgres on another machine.
#
#   cp .env.example .env     # fill in DATABASE_URL
#   make up-remote
#
# ⛔ A SEPARATE FILE RATHER THAN AN OVERRIDE. Compose merges `depends_on`
# additively, so an override cannot un-depend the app from a Postgres service —
# it would keep waiting for a container this stack does not start. Two small
# files that each say one true thing beat one file with a condition in it.
#
# ⛔ AND THERE IS NO VOLUME HERE, WHICH IS THE POINT. The app container holds no
# state: every file it writes is a scratch copy of a corpus under the OS temp
# directory, removed when the request ends and swept at boot if a hard kill
# skipped that. So with an external store, nothing about this stack is durable
# and nothing about it needs backing up — that moves to whoever runs the Postgres.
# ⛔ `productos-staging`, AND THE RENAME IS NOT COSMETIC.
#
# Peter: *"Treat 4100 as staging for now"*. This was `productos-remote`, which describes where its
# STORE lives rather than what the instance IS — and `scripts/stack.sh` now publishes staging's
# identity so both guards can compare against it. Those two disagreed for exactly one commit:
# the guards tested `productos-staging` while the running project was `productos-remote`, so the
# comparison could never fire. A guard measuring a name nothing has is worse than no guard, because
# it reports a pass.
#
# ⛔ Still a FIXED name, unlike the dev stack's. There is one staging instance on purpose; a second
# one would be a second thing people review on, which is the problem this whole arrangement exists
# to prevent.
name: productos-staging

services:
  productos:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ⛔ No default. The instance refuses to start without it, which is the
      #    behaviour wanted here: a remote stack that silently fell back to a
      #    local database would be the "two surfaces, one truth" failure with a
      #    connection string instead of a directory.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env — see .env.example}
      PORT: "4100"
      # ⛔ Unset by default. A shared store usually means a reachable instance, and
      #    single-account mode signs in anything that reaches the port.
      PRODUCTOS_SINGLE_ACCOUNT: ${PRODUCTOS_SINGLE_ACCOUNT:-}
      # ⛔ One line per query, for finding out how many a request makes. Off unless asked:
      #    it would put a customer's corpus in a log.
      PRODUCTOS_DB_DEBUG: ${PRODUCTOS_DB_DEBUG:-}
      # ⛔ `off` treats every request as a signed-in person and makes every project
      #    reachable. There is no sign-in route yet, so this is how the page is used
      #    until there is one. Verdicts written while it is set are not provably human.
      PRODUCTOS_AUTH: ${PRODUCTOS_AUTH:-}
    ports:
      # ⛔ Overridable but defaulted, which is the opposite of the dev stack's `:?` — and deliberately
      #    so. A dev stack has no business guessing an identity; staging has exactly one, and 4100 is
      #    it. The variable exists so a machine already using 4100 for something else can move it.
      - "${STAGING_PORT:-4100}:4100"
